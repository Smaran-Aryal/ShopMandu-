name: shopmandu
description: ShopMandu - a mini e-commerce Flutter application.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.3.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Carousel package from pub.dev (check pub.dev for the latest version)
  carousel_slider: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # Product/banner images are loaded from network URLs.
  # To use local images instead, add them to assets/images/ and uncomment:
  assets:
     - assets/images/
